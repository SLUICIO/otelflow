<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTelFlow — by Sluicio</title>
    <script>
      // Apply theme before the stylesheet loads (no flash). Light is the
      // default; 'auto' follows the OS. Per-device setting. Embeds may pin
      // a theme via a &theme= parameter in the fragment.
      ;(function () {
        var forced =
          location.hash.indexOf('#embed=') === 0 &&
          location.hash.match(/[?&]theme=(light|dark)\b/)
        if (forced) {
          document.documentElement.dataset.theme = forced[1]
          return
        }
        var t = localStorage.getItem('sluicio.theme') || 'auto'
        var dark =
          t === 'dark' ||
          (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/wasm_exec.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
